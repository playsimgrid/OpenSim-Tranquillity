;;
;; Please don't change this file.
;; All optional settings are in GridCommon.ini.example,
;; which you can copy and change.
;;

[Includes]
    Include-Common = "config-include/GridCommon.ini"

[Modules]
    AssetServices           = "RegionAssetConnector"
    InventoryServices       = "RemoteXInventoryServicesConnector"
    GridServices            = "RegionGridServicesConnector"
    AvatarServices          = "RemoteAvatarServicesConnector"
    NeighbourServices       = "NeighbourServicesOutConnector"
    AuthenticationServices  = "RemoteAuthenticationServicesConnector"
    AuthorizationServices   = "LocalAuthorizationServicesConnector"
    PresenceServices        = "RemotePresenceServicesConnector"
    UserAccountServices     = "RemoteUserAccountServicesConnector"
    AgentPreferencesServices= "RemoteAgentPreferencesServicesConnector"
    GridUserServices        = "RemoteGridUserServicesConnector"
    SimulationServices      = "RemoteSimulationConnectorModule"
    EntityTransferModule    = "BasicEntityTransferModule"
    InventoryAccessModule   = "BasicInventoryAccessModule"
    LandServices            = "RemoteLandServicesConnector"
    MapImageService         = "MapImageServiceModule"
    SearchModule            = "BasicSearchModule"
    MuteListService         = "RemoteMuteListServicesConnector"
    ExperienceServices      = "RemoteExperienceServicesConnector"

    LandServiceInConnector        = true
    NeighbourServiceInConnector   = true
    SimulationServiceInConnector  = true
    LibraryModule                 = true

[SimulationDataStore]
    LocalServiceModule = "OpenSim.Services.SimulationService.dll:SimulationDataService"

[EstateDataStore]
    LocalServiceModule = "OpenSim.Services.EstateService.dll:EstateDataService"

[AssetService]
    LocalGridAssetService = "OpenSim.Services.Connectors.dll:AssetServicesConnector"

[GridService]
    LocalServiceModule = "OpenSim.Services.GridService.dll:GridService"
    ; for the LocalGridServicesConnector which is used by the Remote one
    StorageProvider = "OpenSim.Data.Null.dll:NullRegionData"
    NetworkConnector = "OpenSim.Services.Connectors.dll:GridServicesConnector"

    ; Because LocalGridServicesConnector starts this service, in grid mode we need to suppress
    ; the inappropriate console commands that it registers.
    SuppressConsoleCommands = true

[LibraryService]
    LocalServiceModule = "OpenSim.Services.InventoryService.dll:LibraryService"
    LibraryName = "OpenSim Library"
    DefaultLibrary = "./inventory/Libraries.xml"

[Friends]
    Connector = "OpenSim.Services.Connectors.dll:FriendsServicesConnector"

    ; Telling the other regions on this grid that a user arrived or left is a
    ; fan-out: one blocking POST per online friend, made on a .NET thread pool
    ; worker. It was already asynchronous and already unbounded, which is the
    ; problem - a handful of well-connected people arriving or leaving at once could
    ; put more blocking work items on the pool than the pool had workers, and then
    ; logins, teleports, QUERYACCESS, the status page and the watchdog all wait
    ; behind a queue of sockets timing out. SimFPS stays healthy throughout, which
    ; is what makes it look like a network or Robust fault.
    ;
    ; These notifications are no longer put on the .NET thread pool at all. They go
    ; onto a queue drained by MaxConcurrentStatusNotifies dedicated sender threads,
    ; so issuing one never blocks and the number of sockets open at once is fixed.
    ;
    ; StatusNotifyTimeout is per notification, in seconds, and is deliberately a
    ; separate number from the 15s the friendship offer/approve/deny calls keep:
    ; those are one call per user action, and a slow answer still beats none.
    ; MaxConcurrentStatusNotifies is how many senders there are, which is also the
    ; most sockets this can hold open.
    ; StatusNotifyQueueDepth is how deep the queue in front of them may get before
    ; notifications are dropped with a log line. It is generous on purpose: a full
    ; queue means thousands already waiting, which is a different problem from busy.
    ;
    ;StatusNotifyTimeout = 3
    ;MaxConcurrentStatusNotifies = 16
    ;StatusNotifyQueueDepth = 2000

[MapImageService]
    LocalServiceModule = "OpenSim.Services.Connectors.dll:MapImageServicesConnector"
